# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubi98_pinyin
  name: "五笔98·拼音"
  version: "0.2"
  author:
    - 发明人 王永民先生
  description: |
    五笔字型98版＋汉语拼音混合输入。
    2026年10月3日，11:10。
  dependencies:
    - pinyin_simp

switches:
  - options: [ variants_hk, trad_tw, simplification ]
    states: [ 香港繁體, 臺灣繁體, 大陆简体 ]
    reset: [ 2 ]
  - name: emoji_suggestion
    reset: 1
    states: [ 🈚, 🈶 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
  filters:
    - simplifier@variants_hk
    - simplifier@trad_tw
    - simplifier
    - simplifier@emoji_suggestion
    - uniquifier

speller:
  delimiter: " ;'"
  max_code_length: 20  # 四碼頂字上屏，因为五笔+拼音，所以输入字母长度设置10, 方便拼音输入。
  auto_select: false    #修改后需要选择重新部署才能生效

translator:
  dictionary: wubi98_ci
  prism: wubi_pinyin
  enable_charset_filter: true
  enable_sentence: true
  enable_encoder: true
  encode_commit_history: true
  max_phrase_length: 5
  user_dict: user                       
  db_class: tabledb 
  enable_user_dict: true        #true开启用户词典和字频调整
  disable_user_dict_for_patterns:
    - "^z.*$"
    
abc_segmentor:
  extra_tags:
    - reverse_lookup

reverse_lookup:
  dictionary: pinyin_simp
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"

emoji_suggestion:
  opencc_config: emoji.json
  option_name: emoji_suggestion
  tips: all

simplifier:
  opencc_config: t2s.json
  option_name: simplification

variants_hk:
  option_name: variants_hk
  opencc_config: s2hk.json

trad_tw:
  option_name: trad_tw
  opencc_config: s2tw.json
